name: CI

# B5.5: pull requests and merges to main, not every push. Every run of the
# database tests touches staging (about 250 audit rows, 1,100 farmer-number
# counter values and ten authentication accounts per run — accepted cost,
# recorded in docs/PROJECT-STATE.md), and only one run may hold staging at a
# time (an advisory lock taken in vitest.global-setup.ts).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One test run at a time across ALL refs, queued, never cancelled: every run
# holds the staging lock (vitest.global-setup.ts) for twenty to forty
# minutes, and a run that starts while another holds it refuses. The lock
# worked; the cost was a manual re-run on every merge, three in a row under
# the sequential merge order (2026-09-06). GitHub queues them here instead.
# The trade: a superseded run on a branch is no longer cancelled by a newer
# push — it completes, and the newer run waits its turn. A run of staging
# time per superseded push, accepted; a cancelled run could leave its lock
# behind (PROJECT-STATE, "If a run is killed").
concurrency:
  group: staging-tests
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # The database suite is 10-20 minutes from a runner; a hung run must not
    # hold the staging lock for the default six hours.
    timeout-minutes: 60
    steps:
      # Full history: the secret scan reads every commit on the branch, not
      # just the tip. A secret added and then "removed" is still a leak.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # B5.5: the database tests run against STAGING, never production. The
      # five secrets are set by the project owner; the test helpers refuse to
      # run — loudly, not by skipping — if any is missing, and refuse to run
      # against any project but staging whatever the values say.
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Official released binary rather than the marketplace action, which can
      # require a GITLEAKS_LICENSE repository secret. This workflow uses none.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-level info
