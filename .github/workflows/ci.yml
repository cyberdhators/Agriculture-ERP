name: CI

# B5.5: pull requests and merges to main, not every push. Every run of the
# database tests touches staging (about 250 audit rows, 1,100 farmer-number
# counter values and ten authentication accounts per run — accepted cost,
# recorded in docs/PROJECT-STATE.md), and only one run may hold staging at a
# time (an advisory lock taken in vitest.global-setup.ts).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One test run at a time across ALL refs, queued, never cancelled: every run
# holds the staging lock (vitest.global-setup.ts) for twenty to forty
# minutes, and a run that starts while another holds it refuses. The lock
# worked; the cost was a manual re-run on every merge, three in a row under
# the sequential merge order (2026-09-06). GitHub queues them here instead.
# The trade: a superseded run on a branch is no longer cancelled by a newer
# push — it completes, and the newer run waits its turn. A run of staging
# time per superseded push, accepted; a cancelled run could leave its lock
# behind (PROJECT-STATE, "If a run is killed").
concurrency:
  group: staging-tests
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # The database suite is 10-20 minutes from a runner; a hung run must not
    # hold the staging lock for the default six hours.
    timeout-minutes: 90
    steps:
      # Full history: the secret scan reads every commit on the branch, not
      # just the tip. A secret added and then "removed" is still a leak.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # B5.5: the database tests run against STAGING, never production. The
      # five secrets are set by the project owner; the test helpers refuse to
      # run — loudly, not by skipping — if any is missing, and refuse to run
      # against any project but staging whatever the values say.
      #
      # THE SHORT PATH (2026-09-11, the fifth CI edit). 98% of a run is this
      # step: on #54's green run it was 44m46s and every other step together
      # was 47s. A pull request that changes nothing but documents needs none
      # of the staging suite, and four of six pull requests open that day were
      # documents only.
      #
      # THE STEP IS NEVER CONDITIONAL. It always runs, always reports, and
      # decides INSIDE which suite to run. A required check that silently does
      # not run is the shape of the eight skipped test files and the null
      # device column (docs/PROJECT-STATE.md) and must not be reintroduced
      # here. There is no `if:` on this step and there must never be one.
      #
      # ABSENCE IS NOT SUCCESS. The short path runs `pnpm test:pure`, whose
      # config sets `passWithNoTests: false` and whose own guard
      # (tests/pure-suite-complete.test.ts) asserts that every test file in the
      # repository needing no database is one it runs. If the short path cannot
      # run what it claims, it is red, not skipped.
      #
      # The two tests that read docs/api/CONVENTIONS.md are both in the pure
      # suite, so a CONVENTIONS change still meets the drift test and the
      # rule-sentence test on the short path.
      - name: Test
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            changed="$(git diff --name-only "$base"...HEAD)"
          else
            changed="$(git diff --name-only HEAD~1 HEAD || echo FULL)"
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Anything outside the documents means the full suite. The set is
          # docs/, .prettierignore and CLAUDE.md — no test reads any of them.
          #
          # CLAUDE.md was excluded from the short path in the fifth CI edit and
          # added in the sixth (2026-09-11). The reasoning that failed: the law
          # file felt like it deserved more scrutiny, and a database suite is
          # not scrutiny of a document. Nothing in the full suite reads
          # CLAUDE.md; #59, five lines of it, cost 1h5m49s and told us nothing
          # about what changed. The filter is per-file, so a pull request
          # touching CLAUDE.md AND any code still takes the full path.
          outside="$(echo "$changed" | grep -vE '^docs/|^\.prettierignore$|^CLAUDE\.md$' || true)"
          if [ -z "$changed" ]; then
            echo "no changed files could be determined — running the full suite"
            outside="undetermined"
          fi
          if [ -n "$outside" ]; then
            echo "FULL SUITE: these changed files are outside docs/:"
            echo "$outside" | sed 's/^/  /'
            pnpm test
          else
            echo "SHORT PATH: documents only. Running the pure suite (no database)."
            pnpm test:pure
          fi
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Official released binary rather than the marketplace action, which can
      # require a GITLEAKS_LICENSE repository secret. This workflow uses none.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-level info
