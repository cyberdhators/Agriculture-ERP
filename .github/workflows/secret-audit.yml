name: Secret audit (full history)

# ============================================================================
# THE FULL-HISTORY SCAN. AN AUDIT, NOT A MERGE GATE.
# ============================================================================
#
# This is where the scan over all history went when it stopped being a blocking
# check. It was blocking, and the result was a gate that could not be made green:
# gitleaks with no `--log-opts` reads every ref the runner has fetched, so one
# secret on one unmerged branch turned EVERY branch red.
#
# Observed rather than reasoned: #107's leak count rose from one to two because
# #108 was pushed, while #107's own two commits contained no credential pattern of
# any kind. A branch's verdict changed because a different branch existed.
#
#   A GATE WHOSE VERDICT DEPENDS ON WHAT OTHER BRANCHES EXIST IS NOT
#   REPORTING ON THIS BRANCH.
#
# A gate that can never be green is read as noise and then bypassed — and the
# first thing it nearly cost was the Secrets law itself, in a merge order that
# began by merging past this red scan in order to land a law.
#
# So history is audited on a schedule and findings are accounted for in
# `.gitleaksignore` with a written reason. An unexplained new finding is red; a
# known and explained old one is not.
#
# ----------------------------------------------------------------------------
# A SCAN'S ANSWER IS A PROPERTY OF THE REF SET IT WAS GIVEN.
# ----------------------------------------------------------------------------
#
# `fetch-depth: 0` fetches `refs/heads/*` and `refs/tags/*`. It does NOT fetch
# `refs/pull/*`. A local `git log --all` in a working copy that has fetched PR
# merge refs sees commits this scan never will, so a local result and this one
# WILL differ — and CI's is the one that counts, because CI's ref set is the one
# the repository actually publishes. If you are reconciling a local scan against
# this job, that difference is the first thing to check, not the last.

on:
  schedule:
    # Weekly, Monday 03:00 UTC. Nothing depends on the hour; it is outside the
    # working day so a long scan never competes with a run someone is waiting on.
    - cron: '0 3 * * 1'
  workflow_dispatch:
  # ==========================================================================
  # TEMPORARY, AND STRUCTURALLY UNABLE TO ACT OUTSIDE ITS PURPOSE.
  # ==========================================================================
  #
  # `workflow_dispatch` cannot be dispatched for a workflow that is not on the
  # default branch, and main is not pushed to — so without this trigger there is
  # no way to see this scan's findings before it merges, and the first
  # `.gitleaksignore` entries would be written about findings nobody had read.
  #
  # The job below is conditioned on the head ref being exactly this branch. On
  # any other pull request the job does not act. "I will remove it before merge"
  # is a promise, and this repository's record is largely promises:
  #
  #   A TEMPORARY THING REMOVED BY INTENTION WILL BE FORGOTTEN. A TEMPORARY
  #   THING THAT CANNOT ACT OUTSIDE ITS PURPOSE IS SAFE EITHER WAY.
  #
  # It is still to be removed before this pull request goes ready.
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Touches no database, so it queues behind nothing. Deliberately NOT on
    # `staging-tests`: a credential audit should never wait on a test lock.
    steps:
      # The temporary trigger's pin. This is a JOB-level condition on an audit
      # that is not a merge gate — not an `if:` on a required check, which this
      # repository forbids because a check that silently does not run is a merge
      # button with nothing behind it. Nothing requires this job.
      - name: Pin the temporary pull_request trigger to this branch alone
        id: pin
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          head="${{ github.head_ref }}"
          if [ "$event" = "pull_request" ] && [ "$head" != "ci/secret-scan-scope" ]; then
            echo "This audit's pull_request trigger exists only for ci/secret-scan-scope."
            echo "Head ref is '$head'. Doing nothing."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (every branch and tag)
        if: steps.pin.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        if: steps.pin.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Reads all history, by design, and reports locations only. The report
      # carries the matched value: it is parsed in the step and discarded, and it
      # is NEVER uploaded as an artifact — an artifact is a downloadable copy of
      # the credential for anyone who can see the run.
      - name: Secret audit (gitleaks, all history)
        if: steps.pin.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          echo "refs this scan can see:"
          git for-each-ref --format='  %(refname)' | head -50
          node scripts/ci-secret-audit.mjs
