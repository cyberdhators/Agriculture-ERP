packages:
  - 'apps/*'
  - 'packages/*'

# Prisma fetches its query engines and generates its client in postinstall
# scripts. pnpm blocks dependency lifecycle scripts by default; these are
# allowed deliberately.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  # Downloads a binary used only to upload source maps at build time. B1.5
  # does not upload source maps -- that needs CI wiring and a build-time
  # token -- so the binary is not wanted. See docs/PROJECT-STATE.md.
  '@sentry/cli': false
  prisma: true
